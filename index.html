<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#c9a84c" />
  <meta name="description" content="تطبيق لتسجيل ومتابعة ديون المشترين من المحل" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="نظام الديون" />
  <title>نظام إدارة الديون</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon-192.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body,#root{height:100%;font-family:'Cairo',sans-serif;direction:rtl;}
    body{margin:0;background:#0c0f1e;-webkit-tap-highlight-color:transparent;}
    input,button,select,textarea{font-family:inherit;}
    input[type=date]{color-scheme:dark;}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-thumb{background:#c9a84c55;border-radius:4px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
    @keyframes slideDown{from{opacity:0;transform:translateY(-60px);}to{opacity:1;transform:translateY(0);}}
    .fu{animation:fadeUp 0.35s ease forwards;}
    .tap:active{opacity:0.7;transform:scale(0.97);}
    select option{background:#1a1d2e;}
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── Storage: localStorage ──
    const storage = {
      get(key) {
        try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch { return null; }
      },
      set(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
      }
    };

    // ── Icons ──
    const Icon = ({ d, size = 20, color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d={d} />
      </svg>
    );
    const ic = {
      user:   "M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
      lock:   "M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM7 11V7a5 5 0 0 1 10 0v4",
      plus:   "M12 5v14M5 12h14",
      check:  "M20 6L9 17l-5-5",
      list:   "M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01",
      cal:    "M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9zM3 9V7a2 2 0 0 1 2-2h2M21 9V7a2 2 0 0 1-2-2h-2M8 5V3M16 5V3",
      out:    "M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9",
      gear:   "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z",
      money:  "M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6",
      chart:  "M18 20V10M12 20V4M6 20v-6",
      trash:  "M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6",
      store:  "M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10",
      warn:   "M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01",
      search: "M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z",
      x:      "M18 6L6 18M6 6l12 12",
    };

    const today    = () => new Date().toISOString().slice(0,10);
    const fmtDate  = (d) => { if (!d) return ""; return new Date(d).toLocaleDateString("ar-IQ",{year:"numeric",month:"short",day:"numeric"}); };
    const MONTHS   = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
    const G        = "linear-gradient(135deg,#c9a84c,#e8c96c)";
    const BG       = "linear-gradient(160deg,#0c0f1e 0%,#141828 60%,#0c1520 100%)";

    // ─────────────────────────────────────────
    // APP ROOT
    // ─────────────────────────────────────────
    function App() {
      const [page,          setPage]          = useState("login");
      const [loginType,     setLoginType]     = useState("seller");
      const [adminData,     setAdminData]     = useState(() => storage.get("adminData") || { email:"harith21@gmail.com", password:"200521" });
      const [sellers,       setSellers]       = useState(() => storage.get("sellers")   || []);
      const [debts,         setDebts]         = useState(() => storage.get("debts")     || []);
      const [currentSeller, setCurrentSeller] = useState(null);
      const [lEmail,        setLEmail]        = useState("");
      const [lPass,         setLPass]         = useState("");
      const [lErr,          setLErr]          = useState("");
      const [installPrompt, setInstallPrompt] = useState(null);
      const [showBanner,    setShowBanner]    = useState(false);

      // Persist to localStorage
      useEffect(() => { storage.set("adminData", adminData); }, [adminData]);
      useEffect(() => { storage.set("sellers",   sellers);   }, [sellers]);
      useEffect(() => { storage.set("debts",     debts);     }, [debts]);

      // PWA install prompt
      useEffect(() => {
        const handler = (e) => {
          e.preventDefault();
          setInstallPrompt(e);
          setTimeout(() => setShowBanner(true), 3000);
        };
        window.addEventListener("beforeinstallprompt", handler);
        return () => window.removeEventListener("beforeinstallprompt", handler);
      }, []);

      const handleInstall = async () => {
        if (!installPrompt) return;
        installPrompt.prompt();
        const { outcome } = await installPrompt.userChoice;
        if (outcome === "accepted") setInstallPrompt(null);
        setShowBanner(false);
      };

      const doLogin = () => {
        setLErr("");
        if (loginType === "admin") {
          if (lEmail === adminData.email && lPass === adminData.password) {
            setPage("admin"); setLEmail(""); setLPass("");
          } else setLErr("بيانات الدخول غير صحيحة");
        } else {
          const s = sellers.find(x => x.email === lEmail && x.token === lPass);
          if (s) { setCurrentSeller(s); setPage("seller"); setLEmail(""); setLPass(""); }
          else setLErr("البريد أو الرمز غير صحيح");
        }
      };

      const logout = () => { setPage("login"); setCurrentSeller(null); setLErr(""); };

      return (
        <div style={{ minHeight:"100vh", fontFamily:"'Cairo',sans-serif", direction:"rtl", background:BG }}>

          {/* PWA Install Banner */}
          {showBanner && (
            <div style={{ position:"fixed", top:0, left:0, right:0, zIndex:9999, animation:"slideDown 0.4s ease", background:"linear-gradient(135deg,#1a1d2e,#0f1220)", borderBottom:"2px solid rgba(201,168,76,0.4)", padding:"12px 16px", display:"flex", alignItems:"center", gap:12, boxShadow:"0 4px 24px rgba(0,0,0,0.5)" }}>
              <div style={{ width:38, height:38, borderRadius:10, background:G, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                <Icon d={ic.money} size={19} color="#0c0f1e" />
              </div>
              <div style={{ flex:1, minWidth:0 }}>
                <p style={{ color:"#fff", fontWeight:700, fontSize:13 }}>نظام إدارة الديون</p>
                <p style={{ color:"#888", fontSize:11, marginTop:2 }}>ثبّت التطبيق على جهازك للوصول السريع</p>
              </div>
              <button onClick={handleInstall} className="tap" style={{ padding:"8px 14px", borderRadius:9, border:"none", background:G, color:"#0c0f1e", fontWeight:900, fontSize:13, cursor:"pointer", flexShrink:0 }}>
                تثبيت
              </button>
              <button onClick={() => setShowBanner(false)} className="tap" style={{ padding:"8px 10px", borderRadius:9, border:"1px solid rgba(255,255,255,0.12)", background:"transparent", color:"#aaa", fontSize:13, cursor:"pointer", flexShrink:0, fontWeight:700 }}>
                رفض
              </button>
            </div>
          )}

          {page === "login"  && <LoginPage  loginType={loginType} setLoginType={setLoginType} lEmail={lEmail} setLEmail={setLEmail} lPass={lPass} setLPass={setLPass} lErr={lErr} doLogin={doLogin} />}
          {page === "admin"  && <AdminPage  adminData={adminData} setAdminData={setAdminData} sellers={sellers} setSellers={setSellers} debts={debts} logout={logout} />}
          {page === "seller" && <SellerPage seller={currentSeller} debts={debts} setDebts={setDebts} logout={logout} />}
        </div>
      );
    }

    // ─────────────────────────────────────────
    // LOGIN PAGE
    // ─────────────────────────────────────────
    function LoginPage({ loginType, setLoginType, lEmail, setLEmail, lPass, setLPass, lErr, doLogin }) {
      return (
        <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"24px 16px", position:"relative", overflow:"hidden" }}>
          <div style={{ position:"absolute", width:280, height:280, borderRadius:"50%", background:"radial-gradient(circle,rgba(201,168,76,0.1) 0%,transparent 70%)", top:-80, right:-60, pointerEvents:"none" }} />
          <div style={{ position:"absolute", width:220, height:220, borderRadius:"50%", background:"radial-gradient(circle,rgba(80,120,255,0.07) 0%,transparent 70%)", bottom:-60, left:-40, pointerEvents:"none" }} />

          <div className="fu" style={{ textAlign:"center", marginBottom:28 }}>
            <div style={{ width:72, height:72, borderRadius:20, background:G, display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 14px", boxShadow:"0 8px 30px rgba(201,168,76,0.35)" }}>
              <Icon d={ic.money} size={34} color="#0c0f1e" />
            </div>
            <h1 style={{ color:"#c9a84c", fontSize:22, fontWeight:900 }}>نظام إدارة الديون</h1>
            <p style={{ color:"#555", fontSize:13, marginTop:5 }}>سجّل وتابع ديون عملائك بسهولة</p>
          </div>

          <div className="fu" style={{ width:"100%", maxWidth:400, background:"rgba(255,255,255,0.04)", border:"1px solid rgba(201,168,76,0.18)", borderRadius:22, padding:"24px 18px", boxShadow:"0 20px 60px rgba(0,0,0,0.4)" }}>
            {/* Type switch */}
            <div style={{ display:"flex", background:"rgba(0,0,0,0.3)", borderRadius:11, padding:4, marginBottom:24, border:"1px solid rgba(255,255,255,0.06)" }}>
              {[["seller","البائع",ic.store],["admin","المدير",ic.gear]].map(([t,l,d]) => (
                <button key={t} className="tap" onClick={() => setLoginType(t)} style={{ flex:1, padding:"11px 0", borderRadius:8, border:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:7, fontWeight:700, fontSize:15, transition:"all 0.25s", background:loginType===t?G:"transparent", color:loginType===t?"#0c0f1e":"#666" }}>
                  <Icon d={d} size={15} color={loginType===t?"#0c0f1e":"#666"} />{l}
                </button>
              ))}
            </div>

            {[
              ["البريد الإلكتروني", lEmail, setLEmail, "أدخل البريد", ic.user, "email"],
              [loginType==="admin"?"كلمة المرور":"رمز الدخول", lPass, setLPass, loginType==="admin"?"كلمة المرور":"أدخل الرمز", ic.lock, "password"]
            ].map(([label,val,setter,ph,ico,type],i) => (
              <div key={i} style={{ marginBottom:14 }}>
                <label style={{ color:"#999", fontSize:13, marginBottom:7, display:"block" }}>{label}</label>
                <div style={{ position:"relative" }}>
                  <input value={val} onChange={e=>setter(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doLogin()} type={type} placeholder={ph} autoComplete="off"
                    style={{ width:"100%", padding:"14px 46px 14px 14px", borderRadius:11, border:"1px solid rgba(201,168,76,0.22)", background:"rgba(255,255,255,0.05)", color:"#fff", fontSize:16, outline:"none" }} />
                  <span style={{ position:"absolute", right:14, top:"50%", transform:"translateY(-50%)" }}><Icon d={ico} size={18} color="#c9a84c" /></span>
                </div>
              </div>
            ))}

            {lErr && <Msg text={lErr} type="err" />}

            <button onClick={doLogin} className="tap" style={{ width:"100%", padding:"15px", borderRadius:12, border:"none", background:G, color:"#0c0f1e", fontWeight:900, fontSize:17, cursor:"pointer", boxShadow:"0 4px 18px rgba(201,168,76,0.28)", marginTop:4 }}>
              دخول
            </button>
          </div>

          {/* Developer credit */}
          <div className="fu" style={{ marginTop:24, textAlign:"center" }}>
            <p style={{ color:"#2a2a3a", fontSize:12 }}>مطور البرنامج</p>
            <p style={{ color:"rgba(201,168,76,0.5)", fontSize:13, fontWeight:700, marginTop:3, letterSpacing:0.5 }}>حارث حسيب السامرائي</p>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────
    // ADMIN PAGE
    // ─────────────────────────────────────────
    function AdminPage({ adminData, setAdminData, sellers, setSellers, debts, logout }) {
      const [tab,    setTab]    = useState("sellers");
      const [nName,  setNName]  = useState(""); const [nEmail, setNEmail] = useState(""); const [nToken, setNToken] = useState("");
      const [addErr, setAddErr] = useState(""); const [addOk,  setAddOk]  = useState("");
      const [newPw,  setNewPw]  = useState(""); const [pwMsg,  setPwMsg]  = useState("");
      const [delId,  setDelId]  = useState(null);

      const addSeller = () => {
        setAddErr(""); setAddOk("");
        if (!nName||!nEmail||!nToken) { setAddErr("يرجى ملء جميع الحقول"); return; }
        if (sellers.find(s=>s.email===nEmail)) { setAddErr("البريد مسجل مسبقاً"); return; }
        setSellers([...sellers, { id:Date.now().toString(), name:nName, email:nEmail, token:nToken }]);
        setNName(""); setNEmail(""); setNToken(""); setAddOk("تمت الإضافة بنجاح ✓");
        setTimeout(()=>setAddOk(""),3000);
      };

      const totalUnpaid = debts.reduce((a,d)=>a+(d.paid?0:d.amount),0);
      const totalPaid   = debts.reduce((a,d)=>a+(d.paid?d.amount:0),0);

      return (
        <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column" }}>
          <Header title="لوحة المدير" icon={ic.gear} logout={logout} />

          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, padding:"12px 12px 0" }}>
            {[["غير مسددة",totalUnpaid.toLocaleString("ar"),ic.warn,"#ff8080"],["مسددة",totalPaid.toLocaleString("ar"),ic.check,"#5cdb95"],["البائعون",sellers.length,ic.user,"#c9a84c"]].map(([l,v,d,c],i)=>(
              <div key={i} style={{ background:"rgba(255,255,255,0.04)", border:`1px solid ${c}22`, borderRadius:13, padding:"11px 8px", textAlign:"center" }}>
                <Icon d={d} size={17} color={c} />
                <p style={{ color:c, fontSize:17, fontWeight:900, marginTop:5, lineHeight:1 }}>{v}</p>
                <p style={{ color:"#666", fontSize:10, marginTop:3 }}>{l}</p>
              </div>
            ))}
          </div>

          <div style={{ display:"flex", gap:8, padding:"12px 12px 0" }}>
            {[["sellers","البائعون",ic.user],["settings","الإعدادات",ic.gear]].map(([t,l,d])=>(
              <button key={t} onClick={()=>setTab(t)} className="tap" style={{ flex:1, padding:"11px 0", borderRadius:10, border:"none", cursor:"pointer", fontWeight:700, fontSize:14, display:"flex", alignItems:"center", justifyContent:"center", gap:7, background:tab===t?G:"rgba(255,255,255,0.05)", color:tab===t?"#0c0f1e":"#777", outline:"none", transition:"all 0.25s" }}>
                <Icon d={d} size={15} color={tab===t?"#0c0f1e":"#777"} />{l}
              </button>
            ))}
          </div>

          <div style={{ padding:"12px", flex:1, overflowY:"auto", paddingBottom:24 }}>
            {tab === "sellers" && (
              <div className="fu">
                {/* Add form */}
                <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(201,168,76,0.2)", borderRadius:18, padding:"16px", marginBottom:16 }}>
                  <h3 style={{ color:"#c9a84c", fontSize:15, fontWeight:700, marginBottom:14, display:"flex", alignItems:"center", gap:8 }}>
                    <Icon d={ic.plus} size={17} color="#c9a84c" />إضافة بائع جديد
                  </h3>
                  {[["الاسم",nName,setNName,"اسم البائع"],["البريد",nEmail,setNEmail,"example@mail.com"],["رمز الدخول (Token)",nToken,setNToken,"رمز سري"]].map(([l,v,s,p],i)=>(
                    <div key={i} style={{ marginBottom:11 }}>
                      <label style={{ color:"#999", fontSize:12, marginBottom:6, display:"block" }}>{l}</label>
                      <input value={v} onChange={e=>s(e.target.value)} placeholder={p} style={{ width:"100%", padding:"12px 13px", borderRadius:10, border:"1px solid rgba(201,168,76,0.2)", background:"rgba(255,255,255,0.04)", color:"#fff", fontSize:15, outline:"none" }} />
                    </div>
                  ))}
                  {addErr && <Msg text={addErr} type="err" />}
                  {addOk  && <Msg text={addOk}  type="ok"  />}
                  <button onClick={addSeller} className="tap" style={{ width:"100%", padding:"13px", borderRadius:10, border:"none", background:G, color:"#0c0f1e", fontWeight:900, fontSize:15, cursor:"pointer", marginTop:4 }}>
                    إضافة البائع
                  </button>
                </div>

                {/* Sellers list */}
                <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10 }}>
                  <span style={{ color:"#fff", fontSize:14, fontWeight:700 }}>البائعون المسجلون</span>
                  <span style={{ background:"rgba(201,168,76,0.18)", color:"#c9a84c", borderRadius:20, padding:"2px 10px", fontSize:12, fontWeight:700 }}>{sellers.length}</span>
                </div>
                {sellers.length === 0 ? <Empty text="لا يوجد بائعون مسجلون" icon={ic.user} /> :
                  sellers.map(s => (
                    <div key={s.id} style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:14, padding:"13px", marginBottom:9 }}>
                      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:8 }}>
                        <div style={{ display:"flex", alignItems:"center", gap:9, minWidth:0 }}>
                          <div style={{ width:38, height:38, borderRadius:10, background:"linear-gradient(135deg,rgba(201,168,76,0.25),rgba(201,168,76,0.05))", border:"1.5px solid rgba(201,168,76,0.3)", display:"flex", alignItems:"center", justifyContent:"center", color:"#c9a84c", fontWeight:900, fontSize:15, flexShrink:0 }}>
                            {s.name[0]}
                          </div>
                          <div style={{ minWidth:0 }}>
                            <p style={{ color:"#fff", fontWeight:700, fontSize:14, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{s.name}</p>
                            <p style={{ color:"#666", fontSize:11, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{s.email}</p>
                            <p style={{ color:"#c9a84c", fontSize:10, marginTop:1, fontFamily:"monospace" }}>🔑 {s.token}</p>
                          </div>
                        </div>
                        {delId === s.id ? (
                          <div style={{ display:"flex", gap:5, flexShrink:0 }}>
                            <button onClick={()=>{setSellers(sellers.filter(x=>x.id!==s.id));setDelId(null);}} style={{ padding:"7px 11px", borderRadius:8, border:"none", background:"rgba(255,70,70,0.18)", color:"#ff7070", cursor:"pointer", fontSize:12, fontWeight:700 }}>حذف</button>
                            <button onClick={()=>setDelId(null)} style={{ padding:"7px 11px", borderRadius:8, border:"none", background:"rgba(255,255,255,0.07)", color:"#aaa", cursor:"pointer", fontSize:12 }}>لا</button>
                          </div>
                        ) : (
                          <button onClick={()=>setDelId(s.id)} className="tap" style={{ flexShrink:0, padding:"8px 11px", borderRadius:8, border:"1px solid rgba(255,70,70,0.22)", background:"transparent", color:"#ff7070", cursor:"pointer" }}>
                            <Icon d={ic.trash} size={15} color="#ff7070" />
                          </button>
                        )}
                      </div>
                    </div>
                  ))
                }
              </div>
            )}

            {tab === "settings" && (
              <div className="fu" style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(201,168,76,0.2)", borderRadius:18, padding:"18px 16px" }}>
                <h3 style={{ color:"#c9a84c", fontSize:15, fontWeight:700, marginBottom:6, display:"flex", alignItems:"center", gap:8 }}>
                  <Icon d={ic.lock} size={17} color="#c9a84c" />تغيير رمز المدير
                </h3>
                <p style={{ color:"#555", fontSize:12, marginBottom:16 }}>البريد: <span style={{ color:"#999" }}>{adminData.email}</span></p>
                <label style={{ color:"#999", fontSize:13, marginBottom:7, display:"block" }}>كلمة المرور الجديدة</label>
                <input value={newPw} onChange={e=>setNewPw(e.target.value)} type="password" placeholder="أدخل كلمة مرور جديدة" style={{ width:"100%", padding:"13px", borderRadius:10, border:"1px solid rgba(201,168,76,0.2)", background:"rgba(255,255,255,0.04)", color:"#fff", fontSize:15, outline:"none", marginBottom:12 }} />
                {pwMsg && <Msg text={pwMsg} type={pwMsg.includes("✓")?"ok":"err"} />}
                <button onClick={()=>{
                  if(!newPw||newPw.length<4){setPwMsg("كلمة المرور قصيرة جداً");return;}
                  setAdminData({...adminData,password:newPw}); setNewPw(""); setPwMsg("تم التغيير بنجاح ✓");
                  setTimeout(()=>setPwMsg(""),3000);
                }} className="tap" style={{ width:"100%", padding:"13px", borderRadius:10, border:"none", background:G, color:"#0c0f1e", fontWeight:900, fontSize:15, cursor:"pointer" }}>
                  حفظ التغييرات
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────
    // SELLER PAGE
    // ─────────────────────────────────────────
    function SellerPage({ seller, debts, setDebts, logout }) {
      const [tab,             setTab]             = useState("add");
      const [name,            setName]            = useState("");
      const [amount,          setAmount]          = useState("");
      const [date,            setDate]            = useState(today());
      const [note,            setNote]            = useState("");
      const [addMsg,          setAddMsg]          = useState("");
      const [selPerson,       setSelPerson]       = useState(null);
      const [searchQ,         setSearchQ]         = useState("");
      const [fMonth,          setFMonth]          = useState(new Date().getMonth());
      const [fYear,           setFYear]           = useState(new Date().getFullYear());
      const [expandedDebtor,  setExpandedDebtor]  = useState(null);

      const mine       = debts.filter(d => d.sellerId === seller.id);
      const byPerson   = {};
      mine.forEach(d => { if (!byPerson[d.name]) byPerson[d.name]=[]; byPerson[d.name].push(d); });
      const totalUnpaid = mine.reduce((a,d)=>a+(d.paid?0:d.amount),0);
      const totalAll    = mine.reduce((a,d)=>a+d.amount,0);

      const addDebt = () => {
        if (!name||!amount||isNaN(+amount)||+amount<=0) { setAddMsg("يرجى إدخال الاسم والمبلغ"); return; }
        setDebts([...debts, { id:Date.now().toString(), sellerId:seller.id, sellerName:seller.name, name:name.trim(), amount:+amount, date, note, paid:false, createdAt:new Date().toISOString() }]);
        setName(""); setAmount(""); setNote(""); setDate(today());
        setAddMsg("تم التسجيل بنجاح ✓"); setTimeout(()=>setAddMsg(""),3000);
      };
      const toggle = id => setDebts(debts.map(d=>d.id===id?{...d,paid:!d.paid}:d));
      const del    = id => setDebts(debts.filter(d=>d.id!==id));

      const mDebts = mine.filter(d=>{ const dt=new Date(d.date); return dt.getMonth()===fMonth&&dt.getFullYear()===fYear; });
      const mByP   = {};
      mDebts.forEach(d=>{ if(!mByP[d.name])mByP[d.name]={total:0,paid:0,unpaid:0,count:0}; mByP[d.name].total+=d.amount; mByP[d.name].count++; mByP[d.name][d.paid?"paid":"unpaid"]+=d.amount; });

      const TABS = [["add","تسجيل",ic.plus],["debtors","الدائنون",ic.user],["records","السجل",ic.list],["monthly","الشهر",ic.chart]];

      return (
        <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column" }}>
          <Header title="نظام الديون" subtitle={`مرحباً ${seller.name}`} icon={ic.store} logout={logout} />

          {/* Stats */}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, padding:"12px 12px 0" }}>
            {[
              ["الكل",      totalAll>0?totalAll.toLocaleString("ar"):0,                ic.money,"#c9a84c"],
              ["معلق",      totalUnpaid>0?totalUnpaid.toLocaleString("ar"):0,          ic.warn, "#ff8080"],
              ["المدينون",  Object.keys(byPerson).length,                              ic.user, "#64b5f6"]
            ].map(([l,v,d,c],i)=>(
              <div key={i} style={{ background:"rgba(255,255,255,0.04)", border:`1px solid ${c}22`, borderRadius:13, padding:"11px 8px", textAlign:"center" }}>
                <Icon d={d} size={17} color={c} />
                <p style={{ color:c, fontSize:String(v).length>6?12:17, fontWeight:900, marginTop:5, lineHeight:1 }}>{v}</p>
                <p style={{ color:"#666", fontSize:10, marginTop:3 }}>{l}</p>
              </div>
            ))}
          </div>

          {/* Content */}
          <div style={{ flex:1, overflowY:"auto", padding:"12px 12px 80px" }}>

            {/* ── ADD ── */}
            {tab === "add" && (
              <div className="fu">
                <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(201,168,76,0.2)", borderRadius:18, padding:"16px", marginBottom:14 }}>
                  <h3 style={{ color:"#c9a84c", fontSize:15, fontWeight:700, marginBottom:14, display:"flex", alignItems:"center", gap:8 }}>
                    <Icon d={ic.plus} size={17} color="#c9a84c" />تسجيل دين جديد
                  </h3>
                  <Fld label="اسم المشتري"><input value={name} onChange={e=>setName(e.target.value)} placeholder="أدخل الاسم" style={inp} /></Fld>
                  <Fld label="المبلغ (دينار عراقي)"><input value={amount} onChange={e=>setAmount(e.target.value)} type="number" placeholder="0" style={inp} /></Fld>
                  <Fld label="التاريخ"><input value={date} onChange={e=>setDate(e.target.value)} type="date" style={inp} /></Fld>
                  <Fld label="ملاحظة (اختياري)"><textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="أي تفاصيل..." rows={2} style={{ ...inp, resize:"none" }} /></Fld>
                  {addMsg && <Msg text={addMsg} type={addMsg.includes("✓")?"ok":"err"} />}
                  <button onClick={addDebt} className="tap" style={{ width:"100%", padding:"14px", borderRadius:12, border:"none", background:G, color:"#0c0f1e", fontWeight:900, fontSize:16, cursor:"pointer", marginTop:4 }}>
                    تسجيل الدين
                  </button>
                </div>
                <p style={{ color:"#fff", fontSize:14, fontWeight:700, marginBottom:10 }}>آخر السجلات</p>
                {mine.length===0 ? <Empty text="لا توجد ديون مسجلة" icon={ic.money} /> :
                  [...mine].reverse().slice(0,8).map(d=><DebtCard key={d.id} d={d} onToggle={toggle} onDel={del} />)
                }
              </div>
            )}

            {/* ── DEBTORS ── */}
            {tab === "debtors" && (
              <div className="fu">
                <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14 }}>
                  <p style={{ color:"#fff", fontSize:15, fontWeight:700 }}>قائمة الدائنين</p>
                  <span style={{ background:"rgba(201,168,76,0.18)", color:"#c9a84c", borderRadius:20, padding:"2px 10px", fontSize:12, fontWeight:700 }}>{Object.keys(byPerson).length}</span>
                </div>
                {Object.keys(byPerson).length === 0 ? <Empty text="لا يوجد دائنون مسجلون" icon={ic.user} /> :
                  Object.entries(byPerson)
                    .sort((a,b)=>b[1].reduce((s,d)=>s+(d.paid?0:d.amount),0)-a[1].reduce((s,d)=>s+(d.paid?0:d.amount),0))
                    .map(([person, pDebts]) => {
                      const totalD  = pDebts.reduce((a,d)=>a+d.amount,0);
                      const unpaidD = pDebts.reduce((a,d)=>a+(d.paid?0:d.amount),0);
                      const paidD   = pDebts.reduce((a,d)=>a+(d.paid?d.amount:0),0);
                      const isOpen  = expandedDebtor === person;
                      const sorted  = [...pDebts].sort((a,b)=>new Date(b.date)-new Date(a.date));
                      return (
                        <div key={person} style={{ marginBottom:10 }}>
                          <button onClick={()=>setExpandedDebtor(isOpen?null:person)} className="tap" style={{ width:"100%", background:isOpen?"rgba(201,168,76,0.1)":"rgba(255,255,255,0.04)", border:`1px solid ${isOpen?"rgba(201,168,76,0.35)":"rgba(255,255,255,0.08)"}`, borderRadius:isOpen?"16px 16px 0 0":"16px", padding:"14px", cursor:"pointer", textAlign:"right", transition:"all 0.25s", display:"block" }}>
                            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:10 }}>
                              <div style={{ display:"flex", alignItems:"center", gap:10, minWidth:0 }}>
                                <div style={{ width:42, height:42, borderRadius:"50%", background:isOpen?G:"linear-gradient(135deg,rgba(201,168,76,0.22),rgba(201,168,76,0.05))", border:`2px solid ${isOpen?"rgba(201,168,76,0.8)":"rgba(201,168,76,0.3)"}`, display:"flex", alignItems:"center", justifyContent:"center", color:isOpen?"#0c0f1e":"#c9a84c", fontWeight:900, fontSize:17, flexShrink:0, transition:"all 0.25s" }}>
                                  {person[0]}
                                </div>
                                <div style={{ minWidth:0 }}>
                                  <p style={{ color:"#fff", fontWeight:700, fontSize:15, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{person}</p>
                                  <p style={{ color:"#888", fontSize:11, marginTop:2 }}>{pDebts.length} سجل دين</p>
                                </div>
                              </div>
                              <div style={{ textAlign:"left", flexShrink:0 }}>
                                <p style={{ color:unpaidD>0?"#ff8080":"#5cdb95", fontWeight:900, fontSize:15 }}>
                                  {unpaidD>0 ? `${unpaidD.toLocaleString("ar")} د.ع` : "✓ مسدد"}
                                </p>
                                {unpaidD>0&&paidD>0&&<p style={{ color:"#555", fontSize:10, marginTop:1 }}>مسدد: {paidD.toLocaleString("ar")}</p>}
                                <div style={{ textAlign:"center", marginTop:2 }}>
                                  <span style={{ color:"#c9a84c", fontSize:11, display:"inline-block", transform:isOpen?"rotate(180deg)":"rotate(0deg)", transition:"transform 0.3s" }}>▼</span>
                                </div>
                              </div>
                            </div>
                            <div style={{ marginTop:10, background:"rgba(255,255,255,0.06)", borderRadius:4, height:4, overflow:"hidden" }}>
                              <div style={{ height:"100%", borderRadius:4, background:"linear-gradient(90deg,#5cdb95,#3db87a)", width:`${totalD>0?paidD/totalD*100:0}%`, transition:"width 0.5s" }} />
                            </div>
                            <div style={{ display:"flex", justifyContent:"space-between", marginTop:4 }}>
                              <span style={{ color:"#555", fontSize:10 }}>الإجمالي: {totalD.toLocaleString("ar")} د.ع</span>
                              <span style={{ color:"#5cdb95", fontSize:10 }}>{totalD>0?Math.round(paidD/totalD*100):0}% مسدد</span>
                            </div>
                          </button>
                          {isOpen && (
                            <div style={{ background:"rgba(0,0,0,0.25)", border:"1px solid rgba(201,168,76,0.2)", borderTop:"none", borderRadius:"0 0 16px 16px", padding:"4px 12px 12px", animation:"fadeUp 0.25s ease" }}>
                              <p style={{ color:"#c9a84c", fontSize:12, fontWeight:700, marginBottom:8, marginTop:8 }}>📅 تواريخ تسجيل الديون</p>
                              {sorted.map((d,i)=>(
                                <div key={d.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 10px", background:i%2===0?"rgba(255,255,255,0.02)":"transparent", borderRadius:9, marginBottom:3 }}>
                                  <div style={{ width:24, height:24, borderRadius:"50%", border:`2px solid ${d.paid?"#5cdb95":"rgba(255,80,80,0.4)"}`, background:d.paid?"rgba(92,219,149,0.15)":"rgba(255,80,80,0.06)", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                                    {d.paid ? <Icon d={ic.check} size={11} color="#5cdb95" /> : <span style={{ width:7, height:7, borderRadius:"50%", background:"#ff6060", display:"block" }} />}
                                  </div>
                                  <div style={{ flex:1, minWidth:0 }}>
                                    <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:6 }}>
                                      <span style={{ color:"#bbb", fontSize:13 }}>📅 {fmtDate(d.date)}</span>
                                      <span style={{ color:d.paid?"#5cdb95":"#ff8080", fontWeight:900, fontSize:13 }}>{d.amount.toLocaleString("ar")} <span style={{ fontSize:10 }}>د.ع</span></span>
                                    </div>
                                    {d.note && <p style={{ color:"#555", fontSize:11, marginTop:2, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>📝 {d.note}</p>}
                                  </div>
                                  {d.paid && <span style={{ background:"rgba(92,219,149,0.12)", color:"#5cdb95", borderRadius:20, padding:"1px 8px", fontSize:10, fontWeight:700, flexShrink:0 }}>مسدد</span>}
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      );
                    })
                }
              </div>
            )}

            {/* ── RECORDS ── */}
            {tab === "records" && (
              <div className="fu">
                {/* Search */}
                <div style={{ position:"relative", marginBottom:12 }}>
                  <input value={searchQ} onChange={e=>{ setSearchQ(e.target.value); setSelPerson(null); }} placeholder="ابحث عن اسم الدائن..." style={{ width:"100%", padding:"12px 44px 12px 14px", borderRadius:11, border:"1px solid rgba(201,168,76,0.25)", background:"rgba(255,255,255,0.05)", color:"#fff", fontSize:15, outline:"none" }} />
                  <span style={{ position:"absolute", right:14, top:"50%", transform:"translateY(-50%)" }}><Icon d={ic.search} size={18} color="#c9a84c" /></span>
                  {searchQ && <button onClick={()=>setSearchQ("")} style={{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)", background:"transparent", border:"none", cursor:"pointer", padding:2 }}><Icon d={ic.x} size={15} color="#888" /></button>}
                </div>
                {/* Filter chips */}
                <div style={{ display:"flex", gap:7, marginBottom:12, overflowX:"auto", paddingBottom:4 }}>
                  <button onClick={()=>{setSelPerson(null);setSearchQ("");}} className="tap" style={{ flexShrink:0, padding:"8px 15px", borderRadius:8, border:"none", cursor:"pointer", fontWeight:700, fontSize:13, background:!selPerson&&!searchQ?G:"rgba(255,255,255,0.06)", color:!selPerson&&!searchQ?"#0c0f1e":"#999", whiteSpace:"nowrap" }}>
                    الكل ({mine.length})
                  </button>
                  {Object.keys(byPerson).map(p=>(
                    <button key={p} onClick={()=>{setSelPerson(p===selPerson?null:p);setSearchQ("");}} className="tap" style={{ flexShrink:0, padding:"8px 13px", borderRadius:8, border:"none", cursor:"pointer", fontWeight:700, fontSize:13, background:selPerson===p?G:"rgba(255,255,255,0.06)", color:selPerson===p?"#0c0f1e":"#999", whiteSpace:"nowrap" }}>
                      {p}
                    </button>
                  ))}
                </div>
                {(() => {
                  const filtered = Object.entries(byPerson).filter(([p]) => {
                    if (searchQ)    return p.includes(searchQ);
                    if (selPerson)  return p === selPerson;
                    return true;
                  });
                  if (filtered.length === 0) return (
                    <div style={{ textAlign:"center", color:"#444", padding:"36px 0" }}>
                      <Icon d={ic.search} size={42} color="#2a2a3a" />
                      <p style={{ marginTop:10, fontSize:14 }}>لا توجد نتائج</p>
                    </div>
                  );
                  return filtered.map(([person,pDebts])=>{
                    const unp = pDebts.reduce((a,d)=>a+(d.paid?0:d.amount),0);
                    const tot = pDebts.reduce((a,d)=>a+d.amount,0);
                    return (
                      <div key={person} style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:16, overflow:"hidden", marginBottom:14 }}>
                        <div style={{ padding:"12px 14px", background:"rgba(201,168,76,0.07)", borderBottom:"1px solid rgba(201,168,76,0.12)", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                          <div style={{ display:"flex", alignItems:"center", gap:9 }}>
                            <div style={{ width:34, height:34, borderRadius:"50%", background:G, display:"flex", alignItems:"center", justifyContent:"center", color:"#0c0f1e", fontWeight:900, fontSize:14 }}>{person[0]}</div>
                            <div>
                              <p style={{ color:"#fff", fontWeight:700, fontSize:14 }}>{person}</p>
                              <p style={{ color:"#777", fontSize:11 }}>{pDebts.length} سجل</p>
                            </div>
                          </div>
                          <div style={{ textAlign:"left" }}>
                            <p style={{ color:"#ff8080", fontWeight:900, fontSize:14 }}>{unp.toLocaleString("ar")} <span style={{ fontSize:10 }}>د.ع</span></p>
                            <p style={{ color:"#555", fontSize:10 }}>من {tot.toLocaleString("ar")}</p>
                          </div>
                        </div>
                        <div style={{ padding:"9px 11px", display:"flex", flexDirection:"column", gap:6 }}>
                          {[...pDebts].reverse().map(d=><DebtCard key={d.id} d={d} onToggle={toggle} onDel={del} />)}
                        </div>
                      </div>
                    );
                  });
                })()}
              </div>
            )}

            {/* ── MONTHLY ── */}
            {tab === "monthly" && (
              <div className="fu">
                <div style={{ display:"flex", gap:8, marginBottom:14 }}>
                  <select value={fMonth} onChange={e=>setFMonth(+e.target.value)} style={{ flex:1, padding:"11px 10px", borderRadius:10, border:"1px solid rgba(201,168,76,0.22)", background:"rgba(255,255,255,0.05)", color:"#fff", fontSize:14, outline:"none" }}>
                    {MONTHS.map((m,i)=><option key={i} value={i}>{m}</option>)}
                  </select>
                  <select value={fYear} onChange={e=>setFYear(+e.target.value)} style={{ width:88, padding:"11px 8px", borderRadius:10, border:"1px solid rgba(201,168,76,0.22)", background:"rgba(255,255,255,0.05)", color:"#fff", fontSize:14, outline:"none" }}>
                    {[2023,2024,2025,2026,2027].map(y=><option key={y} value={y}>{y}</option>)}
                  </select>
                </div>
                <div style={{ background:"rgba(201,168,76,0.07)", border:"1px solid rgba(201,168,76,0.18)", borderRadius:16, padding:"14px", marginBottom:14 }}>
                  <p style={{ color:"#c9a84c", fontWeight:900, fontSize:15, marginBottom:12 }}>{MONTHS[fMonth]} {fYear}</p>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
                    {[
                      ["الإجمالي",   mDebts.reduce((a,d)=>a+d.amount,0).toLocaleString("ar")+" د.ع",            "#c9a84c"],
                      ["غير مسددة",  mDebts.reduce((a,d)=>a+(d.paid?0:d.amount),0).toLocaleString("ar")+" د.ع", "#ff8080"],
                      ["مسددة",      mDebts.reduce((a,d)=>a+(d.paid?d.amount:0),0).toLocaleString("ar")+" د.ع", "#5cdb95"],
                      ["العمليات",   mDebts.length,                                                              "#64b5f6"],
                    ].map(([l,v,c])=>(
                      <div key={l} style={{ background:"rgba(0,0,0,0.2)", borderRadius:10, padding:"9px 11px" }}>
                        <p style={{ color:"#666", fontSize:11 }}>{l}</p>
                        <p style={{ color:c, fontWeight:900, fontSize:15, marginTop:3 }}>{v}</p>
                      </div>
                    ))}
                  </div>
                </div>
                {Object.keys(mByP).length===0 ? <Empty text="لا توجد بيانات لهذا الشهر" icon={ic.chart} /> :
                  Object.entries(mByP).sort((a,b)=>b[1].unpaid-a[1].unpaid).map(([person,data])=>(
                    <div key={person} style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:16, padding:"14px", marginBottom:10 }}>
                      <div style={{ display:"flex", alignItems:"center", gap:9, marginBottom:12 }}>
                        <div style={{ width:36, height:36, borderRadius:"50%", background:"linear-gradient(135deg,rgba(201,168,76,0.25),rgba(201,168,76,0.05))", border:"1.5px solid rgba(201,168,76,0.3)", display:"flex", alignItems:"center", justifyContent:"center", color:"#c9a84c", fontWeight:900, fontSize:15 }}>{person[0]}</div>
                        <div>
                          <p style={{ color:"#fff", fontWeight:700 }}>{person}</p>
                          <p style={{ color:"#777", fontSize:11 }}>{data.count} عملية</p>
                        </div>
                      </div>
                      {[["الإجمالي",data.total,"#c9a84c"],["غير مسدد",data.unpaid,"#ff8080"],["مسدد",data.paid,"#5cdb95"]].map(([l,v,c])=>(
                        <div key={l} style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                          <span style={{ color:"#777", fontSize:13 }}>{l}</span>
                          <span style={{ color:c, fontWeight:700, fontSize:13 }}>{v.toLocaleString("ar")} د.ع</span>
                        </div>
                      ))}
                      <div style={{ background:"rgba(255,255,255,0.06)", borderRadius:5, height:5, overflow:"hidden", marginTop:8 }}>
                        <div style={{ height:"100%", borderRadius:5, background:"linear-gradient(90deg,#5cdb95,#3db87a)", width:`${data.total>0?data.paid/data.total*100:0}%`, transition:"width 0.5s" }} />
                      </div>
                      <p style={{ color:"#555", fontSize:10, marginTop:4, textAlign:"left" }}>{data.total>0?Math.round(data.paid/data.total*100):0}% مسدد</p>
                    </div>
                  ))
                }
              </div>
            )}
          </div>

          {/* Bottom Nav */}
          <div style={{ position:"fixed", bottom:0, left:0, right:0, background:"rgba(10,12,24,0.97)", borderTop:"1px solid rgba(201,168,76,0.15)", display:"flex", backdropFilter:"blur(14px)", zIndex:20, paddingBottom:"env(safe-area-inset-bottom,4px)" }}>
            {TABS.map(([t,l,d])=>(
              <button key={t} onClick={()=>setTab(t)} className="tap" style={{ flex:1, padding:"10px 4px 8px", border:"none", background:"transparent", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:3 }}>
                <div style={{ width:38, height:34, borderRadius:9, display:"flex", alignItems:"center", justifyContent:"center", background:tab===t?"rgba(201,168,76,0.15)":"transparent", transition:"all 0.2s" }}>
                  <Icon d={d} size={20} color={tab===t?"#c9a84c":"#484860"} />
                </div>
                <span style={{ fontSize:11, fontWeight:700, color:tab===t?"#c9a84c":"#484860" }}>{l}</span>
              </button>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────
    // SHARED COMPONENTS
    // ─────────────────────────────────────────
    function DebtCard({ d, onToggle, onDel }) {
      const [conf, setConf] = useState(false);
      return (
        <div style={{ background:d.paid?"rgba(92,219,149,0.05)":"rgba(255,255,255,0.03)", border:`1px solid ${d.paid?"rgba(92,219,149,0.16)":"rgba(255,80,80,0.1)"}`, borderRadius:12, padding:"10px 11px", display:"flex", alignItems:"center", gap:9, marginBottom:7, transition:"all 0.3s" }}>
          <button onClick={()=>onToggle(d.id)} style={{ width:28, height:28, borderRadius:"50%", border:`2px solid ${d.paid?"#5cdb95":"rgba(255,255,255,0.16)"}`, background:d.paid?"rgba(92,219,149,0.16)":"transparent", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, transition:"all 0.25s" }}>
            {d.paid && <Icon d={ic.check} size={12} color="#5cdb95" />}
          </button>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ display:"flex", alignItems:"center", gap:7, flexWrap:"wrap" }}>
              <span style={{ color:"#fff", fontWeight:700, fontSize:14 }}>{d.name}</span>
              <span style={{ color:d.paid?"#5cdb95":"#ff8080", fontWeight:900, fontSize:14 }}>{d.amount.toLocaleString("ar")} <span style={{ fontSize:10 }}>د.ع</span></span>
              {d.paid && <span style={{ background:"rgba(92,219,149,0.12)", color:"#5cdb95", borderRadius:20, padding:"1px 8px", fontSize:10, fontWeight:700 }}>✓ مسدد</span>}
            </div>
            <div style={{ display:"flex", gap:8, marginTop:2, alignItems:"center" }}>
              <span style={{ color:"#555", fontSize:11 }}>{fmtDate(d.date)}</span>
              {d.note && <span style={{ color:"#444", fontSize:11, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", maxWidth:120 }}>| {d.note}</span>}
            </div>
          </div>
          {conf ? (
            <div style={{ display:"flex", gap:5, flexShrink:0 }}>
              <button onClick={()=>onDel(d.id)} style={{ padding:"5px 9px", borderRadius:7, border:"none", background:"rgba(255,70,70,0.16)", color:"#ff7070", cursor:"pointer", fontSize:12, fontWeight:700 }}>حذف</button>
              <button onClick={()=>setConf(false)} style={{ padding:"5px 9px", borderRadius:7, border:"none", background:"rgba(255,255,255,0.06)", color:"#aaa", cursor:"pointer", fontSize:12 }}>لا</button>
            </div>
          ) : (
            <button onClick={()=>setConf(true)} className="tap" style={{ flexShrink:0, background:"transparent", border:"none", cursor:"pointer", padding:5, opacity:0.45 }}>
              <Icon d={ic.trash} size={15} color="#ff6060" />
            </button>
          )}
        </div>
      );
    }

    function Header({ title, subtitle, icon, logout }) {
      return (
        <div style={{ background:"rgba(0,0,0,0.4)", borderBottom:"1px solid rgba(201,168,76,0.16)", padding:"0 14px", height:56, display:"flex", alignItems:"center", justifyContent:"space-between", flexShrink:0, position:"sticky", top:0, zIndex:10, backdropFilter:"blur(12px)" }}>
          <div style={{ display:"flex", alignItems:"center", gap:9 }}>
            <div style={{ width:34, height:34, borderRadius:9, background:G, display:"flex", alignItems:"center", justifyContent:"center" }}>
              <Icon d={icon} size={17} color="#0c0f1e" />
            </div>
            <div>
              <p style={{ color:"#fff", fontWeight:700, fontSize:14, lineHeight:1.2 }}>{title}</p>
              {subtitle && <p style={{ color:"#777", fontSize:11 }}>{subtitle}</p>}
            </div>
          </div>
          <button onClick={logout} className="tap" style={{ background:"rgba(255,70,70,0.1)", border:"1px solid rgba(255,70,70,0.22)", borderRadius:8, padding:"7px 12px", color:"#ff7070", cursor:"pointer", display:"flex", alignItems:"center", gap:5, fontSize:13, fontWeight:700 }}>
            <Icon d={ic.out} size={14} color="#ff7070" />خروج
          </button>
        </div>
      );
    }

    const inp = { width:"100%", padding:"12px 13px", borderRadius:10, border:"1px solid rgba(201,168,76,0.2)", background:"rgba(255,255,255,0.04)", color:"#fff", fontSize:15, outline:"none" };

    function Fld({ label, children }) {
      return (
        <div style={{ marginBottom:12 }}>
          <label style={{ color:"#999", fontSize:12, marginBottom:6, display:"block" }}>{label}</label>
          {children}
        </div>
      );
    }

    function Msg({ text, type }) {
      return (
        <div style={{ background:type==="ok"?"rgba(92,219,149,0.09)":"rgba(255,70,70,0.09)", border:`1px solid ${type==="ok"?"rgba(92,219,149,0.28)":"rgba(255,70,70,0.28)"}`, borderRadius:9, padding:"10px 12px", marginBottom:11, display:"flex", alignItems:"center", gap:8, color:type==="ok"?"#5cdb95":"#ff8080", fontSize:13 }}>
          <Icon d={type==="ok"?ic.check:ic.warn} size={14} color={type==="ok"?"#5cdb95":"#ff8080"} />{text}
        </div>
      );
    }

    function Empty({ text, icon }) {
      return (
        <div style={{ textAlign:"center", color:"#3a3a4a", padding:"36px 0" }}>
          <Icon d={icon} size={42} color="#2a2a3a" />
          <p style={{ marginTop:10, fontSize:14 }}>{text}</p>
        </div>
      );
    }

    // ── Mount ──
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>

  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(r => console.log('✅ SW registered:', r.scope))
          .catch(e => console.warn('SW error:', e));
      });
    }
  </script>
</body>
</html>
