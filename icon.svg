<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1220"/>
      <stop offset="100%" style="stop-color:#1a1d2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#e8c96c"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a07830"/>
      <stop offset="100%" style="stop-color:#c9a84c"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="512" height="512" rx="110" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4"/>

  <!-- Decorative circle bg glow -->
  <circle cx="256" cy="256" r="190" fill="url(#gold)" opacity="0.07"/>

  <!-- Coin circle -->
  <circle cx="256" cy="220" r="120" fill="url(#gold)" opacity="0.15"/>
  <circle cx="256" cy="220" r="110" fill="none" stroke="url(#gold)" stroke-width="8"/>

  <!-- Dollar/Dinar sign inside coin -->
  <line x1="256" y1="130" x2="256" y2="310" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
  <path d="M296 165 C296 165 220 155 220 195 C220 235 296 225 296 265 C296 305 220 295 220 295" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>

  <!-- Ledger lines below (representing records) -->
  <rect x="140" y="370" width="232" height="14" rx="7" fill="url(#gold)" opacity="0.8"/>
  <rect x="160" y="396" width="192" height="10" rx="5" fill="url(#gold)" opacity="0.5"/>
  <rect x="180" y="418" width="152" height="10" rx="5" fill="url(#gold)" opacity="0.3"/>

  <!-- Small checkmark dot on right of first ledger -->
  <circle cx="130" cy="377" r="9" fill="#5cdb95" opacity="0.9"/>
</svg>
